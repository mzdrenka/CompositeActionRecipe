name: 'CI Workflow (przeplyw pracy CI)'
on:
  push:
  pull_request:
  issues:
    types: [opened]

jobs:
  ci-jobs:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Run mu own composite action
        id: my-action
        uses: ./
        with:
          who-to-greet: "@mateusz"
      - name: Output the answer
        run: echo "Odpowiedz to ${{ steps.my-action.outputs.answer }}"
